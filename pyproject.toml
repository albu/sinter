[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sinter"
version = "0.3.0"
description = "Research prototype for compiler-based image augmentation optimization"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "albumentations>=1.3.0",
    "torch>=2.0",
]

[tool.maturin]
module-name = "sinter"
features = ["python"]

# Enable strip for smaller binaries
strip = true
