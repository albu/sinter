name: Build Wheels (Native Rust + SIMD)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install maturin
      run: |
        pip install maturin

    - name: Build wheel (Pure Native Rust + ARM NEON)
      run: |
        maturin build --release --features "python" --out dist

    - name: Verify wheel
      run: |
        WHEEL=$(ls dist/*.whl | head -1)
        echo "Wheel: $WHEEL"
        ls -lh "$WHEEL"

    - name: Test wheel installation (full test suite)
      run: |
        pip install pytest numpy opencv-python-headless albumentations torch
        pip install dist/*.whl
        pytest python/tests/

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sinter-macos-arm64
        path: dist/*.whl
        retention-days: 30

    - name: Upload wheel to release (on tags)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
