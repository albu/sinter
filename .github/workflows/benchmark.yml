name: Performance Benchmarks (vs OpenCV & Albumentations)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'src/**'
      - 'python/**'
      - 'Cargo.*'
      - '.github/workflows/benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'python/**'
      - 'Cargo.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-macos-arm64:
    name: Benchmark on macOS ARM64 (Apple Silicon)
    runs-on: macos-14
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      contains(github.event.pull_request.labels.*.name, 'benchmark') ||
      contains(github.event.pull_request.title, '[bench]') ||
      contains(github.event.pull_request.title, '[benchmark]') ||
      contains(github.event.head_commit.message, '[bench]') ||
      contains(github.event.head_commit.message, '[benchmark]')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install maturin numpy opencv-python-headless albumentations torch

    - name: Build wheel (release with SIMD)
      run: |
        maturin build --release --features "python" --out dist

    - name: Install Sinter wheel
      run: |
        pip install dist/*.whl

    - name: Run CI Benchmark Suite
      run: |
        python python/benchmarks/ci_benchmark.py
