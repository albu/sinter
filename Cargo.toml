[package]
name = "sinter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/username/sinter"
readme = "README.md"
description = "Research prototype for compiler-based image augmentation optimization"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable SIMD optimizations (requires nightly Rust)
simd = []
# Enable Python bindings (requires PyO3)
python = ["pyo3", "numpy"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.20", optional = true }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"

[dev-dependencies]
