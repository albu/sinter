[package]
name = "sinter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/username/sinter"
readme = "README.md"
description = "Research prototype for compiler-based image augmentation optimization"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable SIMD optimizations (requires nightly Rust)
simd = []
# Enable Python bindings (requires PyO3)
python = ["pyo3", "numpy"]
# Enable OpenCV backend for optimized operations
opencv = ["dep:opencv"]
# Enable OpenCV backend with static linking (requires building OpenCV statically)
# Note: opencv-static includes opencv to enable all the #[cfg(feature = "opencv")] code
opencv-static = ["opencv"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
numpy = { version = "0.20", optional = true }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
opencv = { version = "0.92", default-features = false, features = ["imgproc"], optional = true }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"

[dev-dependencies]
